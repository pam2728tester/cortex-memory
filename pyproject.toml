[project]
name = "cortex-memory"
version = "0.1.0"
description = "Unified local-first agent memory system (Frankenstein design: OctavianTocan/agent-memory + adeoluo/agent-memory + rohitg00/agentmemory + TAIPANBOX/engram)"
requires-python = ">=3.10"

[project.scripts]
cortex = "cortex_memory.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cortex_memory*"]
